<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuentas Claras - by FerDev 🥩🍻</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuentas Claras" />
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen py-6 px-4 flex flex-col justify-between">
    <div class="max-w-md mx-auto w-full bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700">
        <header class="flex justify-between items-start mb-5">
            <div class="text-left">
                <h1 class="text-2xl font-black leading-none">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-indigo-400">
                        Cuentas Claras
                    </span>
                    <span class="text-xl inline-block ml-0.5 select-none">🥩🍻</span>
                </h1>

                <span class="block text-[10px] font-medium text-slate-500 tracking-wider mt-1">
                    by FerDev
                </span>
                <p class="text-xs text-slate-400 mt-1">Cuentas claras, amistades duraderas.</p>
            </div>

            <!-- Botón Reset optimizado (Corto y preciso) -->
            <button id="btn-reset" title="Reiniciar juntada"
                class="bg-slate-700 hover:bg-slate-650 text-slate-300 px-3 py-2 rounded-xl border border-slate-600 transition-all active:scale-95 text-xs font-semibold shrink-0">
                🔄 Reset
            </button>
        </header>

        <div class="mb-5 bg-slate-850 p-4 rounded-xl border border-slate-700 shadow-inner">
            <label for="total-personas" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                ¿Cuántos son en total?
            </label>
            <input type="number" id="total-personas" inputmode="numeric" pattern="[0-9]*" min="1" placeholder="Ej: 8"
                class="w-full px-4 py-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white font-bold text-lg transition-colors" />
        </div>

        <div class="mb-5">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                Registrar gasto
            </h2>
            <form id="persona-form" class="space-y-2">
                <div class="grid grid-cols-12 gap-2">
                    <input type="text" id="nombre" placeholder="Quién (ej: Fer)" required
                        class="col-span-7 px-3 py-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white text-sm" />

                    <input type="number" id="monto" placeholder="$ ¿Cuánto?" required inputmode="numeric" min="1"
                        class="col-span-5 px-3 py-2.5 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white font-semibold text-sm" />
                </div>

                <div id="contenedor-chips"
                    class="flex gap-1.5 overflow-x-auto py-1 text-[11px] text-slate-400 scrollbar-none items-center hidden">
                    <div class="flex items-center gap-1 shrink-0">
                        <span class="text-[10px] uppercase font-bold text-slate-500">Rápidos:</span>
                        <button type="button" id="btn-limpiar-historial"
                            class="text-slate-600 hover:text-red-400 font-bold mr-1 text-[12px]"
                            title="Borrar historial de nombres">
                            ✕
                        </button>
                    </div>
                    <div id="lista-chips" class="flex gap-1.5 overflow-x-auto"></div>
                </div>

                <div class="grid grid-cols-12 gap-2 mt-1">
                    <input type="text" id="alias" placeholder="Alias o CBU (Opcional)"
                        class="col-span-10 px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 text-white text-xs placeholder:text-slate-500" />

                    <button type="submit"
                        class="col-span-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold rounded-lg transition-all flex items-center justify-center text-xl">
                        +
                    </button>
                </div>
            </form>
        </div>

        <div class="mb-5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                Aportes cargados
            </h3>
            <ul id="lista-personas"
                class="divide-y divide-slate-700 bg-slate-900/50 rounded-xl p-3 min-h-[60px] border border-slate-700/50">
                <p id="sin-personas" class="text-slate-500 text-center py-2 text-sm italic">
                    Nadie aportó todavía.
                </p>
            </ul>
        </div>

        <button id="btn-calcular" disabled
            class="w-full bg-slate-700 text-slate-500 font-bold py-3.5 rounded-xl transition-all shadow-lg text-md tracking-wide uppercase cursor-not-allowed">
            🚀 Calcular gastos
        </button>

        <div id="resultados-section" class="hidden mt-6 border-t border-slate-700 pt-5 space-y-5">
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-indigo-950/40 border border-indigo-500/30 p-3 rounded-xl">
                    <span class="block text-[10px] text-indigo-300 uppercase font-bold tracking-wider">Gasto
                        Total</span>
                    <span id="gasto-total" class="text-xl font-black text-indigo-400">$0</span>
                </div>
                <div class="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-xl">
                    <span class="block text-[10px] text-emerald-300 uppercase font-bold tracking-wider">Por
                        persona</span>
                    <span id="cuota-individual" class="text-xl font-black text-emerald-400">$0</span>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-baseline mb-2">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider">
                        ¿Quién le transfiere a quién?
                    </h3>
                    <span class="text-[9px] text-slate-500 font-medium italic shrink-0">💡 Tocá un alias para copiarlo</span>
                </div>
                <div id="contenedor-transferencias" class="max-h-60 overflow-y-auto bg-slate-900 border border-slate-700/60 rounded-xl divide-y divide-slate-800 shadow-sm"></div>
            </div>

            <button id="btn-compartir"
                class="w-full bg-slate-700 hover:bg-slate-650 active:scale-[0.98] text-emerald-400 font-bold py-3 rounded-xl transition-all border border-slate-600 flex items-center justify-center gap-2 text-sm">
                📋 Copiar Resumen para WhatsApp
            </button>
        </div>
    </div>

    <footer class="text-center text-[10px] text-slate-600 mt-4">
        Cuentas Claras v2.5 • Desarrollado por FerDev
    </footer>

    <script>
        let aportantes =
            JSON.parse(localStorage.getItem("cc_aportantes_v5")) || [];
        let historialNombres =
            JSON.parse(localStorage.getItem("cc_historial_nombres_v5")) || [];
        let textoCompartir = "";

        const inputNombre = document.getElementById("nombre");
        const inputMonto = document.getElementById("monto");
        const inputAlias = document.getElementById("alias");
        const inputTotalPersonas = document.getElementById("total-personas");
        const form = document.getElementById("persona-form");
        const listaPersonas = document.getElementById("lista-personas");
        const sinPersonas = document.getElementById("sin-personas");
        const btnCalcular = document.getElementById("btn-calcular");
        const resultadosSection = document.getElementById("resultados-section");
        const txtGastoTotal = document.getElementById("gasto-total");
        const txtCuotaIndividual = document.getElementById("cuota-individual");
        const contenedorTransferencias = document.getElementById(
            "contenedor-transferencias",
        );
        const btnCompartir = document.getElementById("btn-compartir");
        const btnReset = document.getElementById("btn-reset");
        const contenedorChips = document.getElementById("contenedor-chips");
        const listaChips = document.getElementById("lista-chips");
        const btnLimpiarHistorial = document.getElementById(
            "btn-limpiar-historial",
        );

        if (localStorage.getItem("cc_total_personas_v5")) {
            inputTotalPersonas.value = localStorage.getItem("cc_total_personas_v5");
        }

        actualizarLista();
        actualizarChips();
        chequearEstadoBotonCalcular();

        inputMonto.addEventListener("keydown", (e) => {
            if (["-", "+", "e", "E", ",", "."].includes(e.key)) e.preventDefault();
        });
        inputMonto.addEventListener("input", (e) => {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.startsWith("0")) valor = valor.replace(/^0+/, "");
            e.target.value = valor;
        });

        inputTotalPersonas.addEventListener("keydown", (e) => {
            if (["-", "+", "e", "E", ",", "."].includes(e.key)) e.preventDefault();
        });
        inputTotalPersonas.addEventListener("input", (e) => {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.startsWith("0")) valor = valor.replace(/^0+/, "");
            e.target.value = valor;
            localStorage.setItem("cc_total_personas_v5", e.target.value);
            resultadosSection.classList.add("hidden");
            validarCantidadPersonas();
            chequearEstadoBotonCalcular();
        });

        inputNombre.addEventListener("input", (e) => {
            e.target.value = e.target.value.replace(
                /[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,
                "",
            );
        });

        function validarCantidadPersonas() {
            const total = parseInt(inputTotalPersonas.value) || 0;
            if (total > 0 && total < aportantes.length) {
                inputTotalPersonas.classList.add("border-red-500", "bg-red-950/20");
            } else {
                inputTotalPersonas.classList.remove(
                    "border-red-500",
                    "bg-red-950/20",
                );
            }
        }

        function chequearEstadoBotonCalcular() {
            const totalGente = parseInt(inputTotalPersonas.value) || 0;
            const tieneAportantes = aportantes.length > 0;

            if (
                totalGente > 0 &&
                tieneAportantes &&
                totalGente >= aportantes.length
            ) {
                btnCalcular.disabled = false;
                btnCalcular.className =
                    "w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition-all shadow-lg text-md tracking-wide uppercase cursor-pointer";
            } else {
                btnCalcular.disabled = true;
                btnCalcular.className =
                    "w-full bg-slate-700 text-slate-500 font-bold py-3.5 rounded-xl transition-all shadow-lg text-md tracking-wide uppercase cursor-not-allowed";
            }
        }

        function agregarAlHistorial(nombre) {
            historialNombres = historialNombres.filter(
                (n) => n.toLowerCase() !== nombre.toLowerCase(),
            );
            historialNombres.unshift(nombre);
            if (historialNombres.length > 5) historialNombres.pop();
            localStorage.setItem(
                "cc_historial_nombres_v5",
                JSON.stringify(historialNombres),
            );
            actualizarChips();
        }

        function actualizarChips() {
            listaChips.innerHTML = "";
            if (historialNombres.length === 0) {
                contenedorChips.classList.add("hidden");
                return;
            }
            contenedorChips.classList.remove("hidden");

            historialNombres.forEach((nombre) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className =
                    "bg-slate-700 hover:bg-slate-640 active:scale-95 px-2.5 py-1 rounded-md shrink-0 transition-all font-medium text-slate-200";
                btn.innerText = nombre;
                btn.onclick = () => {
                    inputNombre.value = nombre;
                    inputMonto.focus();
                };
                listaChips.appendChild(btn);
            });
        }

        btnLimpiarHistorial.addEventListener("click", () => {
            historialNombres = [];
            localStorage.removeItem("cc_historial_nombres_v5");
            actualizarChips();
        });

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const nombre = inputNombre.value.trim();
            const monto = parseFloat(inputMonto.value) || 0;
            const alias = inputAlias.value.trim();

            if (monto <= 0) return;

            aportantes.push({ nombre, monto, alias });
            agregarAlHistorial(nombre);
            guardarEstado();
            actualizarLista();
            validarCantidadPersonas();
            chequearEstadoBotonCalcular();
            form.reset();
            inputNombre.focus();
        });

        function guardarEstado() {
            localStorage.setItem("cc_aportantes_v5", JSON.stringify(aportantes));
        }

        function actualizarLista() {
            listaPersonas.innerHTML = "";
            if (aportantes.length === 0) {
                sinPersonas.classList.remove("hidden");
                listaPersonas.appendChild(sinPersonas);
                return;
            }
            sinPersonas.classList.add("hidden");

            aportantes.forEach((p, index) => {
                const li = document.createElement("li");
                li.className =
                    "flex justify-between items-center py-2.5 text-slate-300 text-sm";
                const aliasBadge = p.alias
                    ? `<span class="block text-[10px] text-slate-500 truncate max-w-[150px]">🔑 ${p.alias}</span>`
                    : "";

                li.innerHTML = `
                    <div class="truncate pr-2">
                        <span class="font-medium text-slate-200 block truncate">${p.nombre}</span>
                        ${aliasBadge}
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <span class="bg-emerald-950 text-emerald-400 border border-emerald-500/30 px-3 py-0.5 rounded-full text-xs font-bold">$${p.monto}</span>
                        <button onclick="eliminarAportante(${index})" class="text-slate-500 hover:text-red-400 font-bold px-1">✕</button>
                    </div>
                `;
                listaPersonas.appendChild(li);
            });
        }

        window.eliminarAportante = function (index) {
            aportantes.splice(index, 1);
            guardarEstado();
            actualizarLista();
            validarCantidadPersonas();
            chequearEstadoBotonCalcular();
            resultadosSection.classList.add("hidden");
        };

        btnReset.addEventListener("click", () => {
            if (confirm("¿Querés borrar los datos de esta juntada?")) {
                aportantes = [];
                inputTotalPersonas.value = "";
                localStorage.removeItem("cc_aportantes_v5");
                localStorage.removeItem("cc_total_personas_v5");
                actualizarLista();
                validarCantidadPersonas();
                chequearEstadoBotonCalcular();
                resultadosSection.classList.add("hidden");
                form.reset();
            }
        });

        window.copiarAliasRapido = function (btn, textoAlias) {
            navigator.clipboard.writeText(textoAlias).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<span class="text-[10px] text-emerald-400 font-bold animate-pulse">✓ Copiado</span>`;
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                }, 1500);
            });
        };

        btnCalcular.addEventListener("click", () => {
            const totalGente = parseInt(inputTotalPersonas.value) || 0;
            const gastoTotal = aportantes.reduce((sum, p) => sum + p.monto, 0);
            const cuotaIndividual = gastoTotal / totalGente;

            txtGastoTotal.innerText = `$${gastoTotal.toLocaleString("es-AR", { maximumFractionDigits: 0 })}`;
            txtCuotaIndividual.innerText = `$${cuotaIndividual.toLocaleString("es-AR", { maximumFractionDigits: 0 })}`;

            const todos = [...aportantes];
            const losDemas = totalGente - aportantes.length;

            if (losDemas === 1) {
                todos.push({ nombre: "El que falta", monto: 0, alias: "" });
            } else if (losDemas > 1) {
                for (let i = 1; i <= losDemas; i++) {
                    todos.push({ nombre: `Invitado #${i}`, monto: 0, alias: "" });
                }
            }

            let deudores = [];
            let acreedores = [];

            todos.forEach((p) => {
                const saldo = p.monto - cuotaIndividual;
                if (saldo < -0.99)
                    deudores.push({ nombre: p.nombre, saldo: Math.abs(saldo) });
                if (saldo > 0.99)
                    acreedores.push({ nombre: p.nombre, saldo: saldo, alias: p.alias });
            });

            contenedorTransferencias.innerHTML = "";
            let i = 0,
                j = 0;
            let lineasMensaje = [];

            while (i < deudores.length && j < acreedores.length) {
                let d = deudores[i];
                let a = acreedores[j];

                if (d.saldo < 1) {
                    i++;
                    continue;
                }
                if (a.saldo < 1) {
                    j++;
                    continue;
                }

                let transferir = Math.min(d.saldo, a.saldo);

                const div = document.createElement("div");
div.className = "grid grid-cols-12 items-center text-xs gap-1 py-2.5 px-3 border-b border-slate-800 last:border-b-0";

                const aliasColumnHtml = a.alias
                    ? `<button onclick="copiarAliasRapido(this, '${a.alias}')" class="col-span-4 text-left pl-2 border-l border-slate-800 cursor-pointer focus:outline-none w-full group">
                        <span class="block text-[8px] text-slate-500 font-bold uppercase tracking-wide group-hover:text-indigo-400 transition-colors">Alias (Toca)</span>
                        <span class="block text-[11px] text-indigo-400 font-semibold truncate max-w-full">${a.alias}</span>
                       </button>`
                    : `<div class="col-span-4"></div>`;

                div.innerHTML = `
                    <span class="col-span-3 text-red-400 font-bold text-left truncate" title="${d.nombre}">${d.nombre}</span>
                    <div class="col-span-2 flex flex-col items-center justify-center border-l border-slate-800 px-0.5">
                        <span class="text-[8px] uppercase font-bold text-slate-500">Paga</span>
                        <span class="text-xs font-black text-white">$${Math.round(transferir)}</span>
                    </div>
                    <span class="col-span-3 text-emerald-400 font-bold text-left truncate border-l border-slate-800 pl-1.5" title="${a.nombre}">a ${a.nombre}</span>
                    ${aliasColumnHtml}
                `;
                contenedorTransferencias.appendChild(div);

                const stringAliasWhats = a.alias ? ` *(Alias: ${a.alias})*` : "";
                lineasMensaje.push(
                    `• *${d.nombre}* ➡️ *$${Math.round(transferir)}* a *${a.nombre}*${stringAliasWhats}`,
                );

                d.saldo -= transferir;
                a.saldo -= transferir;

                if (d.saldo < 1) i++;
                if (a.saldo < 1) j++;
            }

            if (contenedorTransferencias.innerHTML === "") {
                contenedorTransferencias.innerHTML = `<div class="text-center py-4 text-slate-400 text-sm font-medium">Estamos todos a mano 🤝</div>`;
                textoCompartir =
                    "💰 *Cuentas Claras* \n¡Estamos todos a mano! No se debe nada.";
            } else {
                textoCompartir =
                    `💰 *RESUMEN DE LA JUNTADA* 🥩🍻\n\n` +
                    `• *Gasto Total:* $${Math.round(gastoTotal)}\n` +
                    `• *Por cabeza:* $${Math.round(cuotaIndividual)}\n\n` +
                    `*TRANSFERENCIAS:* \n` +
                    lineasMensaje.join("\n") +
                    `\n\n_Calculado con Cuentas Claras_`;
            }

            resultadosSection.classList.remove("hidden");
            resultadosSection.scrollIntoView({ behavior: "smooth" });
        });

        btnCompartir.addEventListener("click", () => {
            navigator.clipboard
                .writeText(textoCompartir)
                .then(() => {
                    const originalText = btnCompartir.innerHTML;
                    btnCompartir.innerHTML = "✅ ¡Resumen copiado!";
                    btnCompartir.classList.replace("text-emerald-400", "text-white");
                    btnCompartir.classList.add("bg-emerald-700");

                    setTimeout(() => {
                        btnCompartir.innerHTML = originalText;
                        btnCompartir.classList.replace("text-white", "text-emerald-400");
                        btnCompartir.classList.remove("bg-emerald-700");
                    }, 2000);
                })
                .catch((err) => {
                    alert("Error al copiar.");
                });
        });
    </script>
</body>

</html>
